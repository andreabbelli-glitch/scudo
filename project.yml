# Progetto Xcode generato con XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Dopo aver modificato questo file: `xcodegen generate`.
# Identificativi, team e versione si cambiano in Config/Scudo.xcconfig.
name: Scudo
options:
  developmentLanguage: it
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Scudo.xcconfig
  Release: Config/Scudo.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  ScudoKit:
    path: Packages/ScudoKit

targetTemplates:
  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/ContentBlocker
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: ScudoKit
        product: ScudoShared
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Extensions/ContentBlocker/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/ContentBlocker/ContentBlocker.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).blocker.${blockerKind}
        SCUDO_BLOCKER_KIND: ${blockerKind}
        SCUDO_BLOCKER_DISPLAY_NAME: ${displayName}
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

targets:
  Scudo:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: ScudoKit
        product: ScudoKit
      - package: ScudoKit
        product: ScudoShared
      - target: BlockerAds
      - target: BlockerPrivacy
      - target: BlockerAnnoyances
      - target: BlockerSecurity
    settings:
      base:
        # Solo iPhone: niente screenshot iPad in App Store Connect.
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Scudo.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  BlockerAds:
    templates: [ContentBlocker]
    templateAttributes:
      blockerKind: ads
      displayName: Scudo Pubblicità

  BlockerPrivacy:
    templates: [ContentBlocker]
    templateAttributes:
      blockerKind: privacy
      displayName: Scudo Privacy

  BlockerAnnoyances:
    templates: [ContentBlocker]
    templateAttributes:
      blockerKind: annoyances
      displayName: Scudo Fastidi

  BlockerSecurity:
    templates: [ContentBlocker]
    templateAttributes:
      blockerKind: security
      displayName: Scudo Sicurezza

schemes:
  Scudo:
    build:
      targets:
        Scudo: all
    run:
      config: Debug
    archive:
      config: Release
